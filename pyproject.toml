[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usseg-startracker"
version = "0.3.0.dev0"
description = "USSEG image-to-attitude star tracker pipeline"
requires-python = ">=3.10,<3.11"
dynamic = ["dependencies"]

[project.scripts]
usseg-startracker = "models.pipeline.cli:main"
usseg-runtime = "usseg_runtime.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["models*", "utils*", "configs*", "usseg_runtime*"]
exclude = ["tests*", "tools*", "examples*"]

[tool.setuptools.package-data]
configs = ["examples/*.json", "runtime/*.json", "runtime/profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
